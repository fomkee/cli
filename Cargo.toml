[workspace]
members = ["."]
resolver = "3"

[package]
name = "fomkee-cli"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Human-friendly command-line client for the Fomkee monitoring API"
repository = "https://github.com/fomkee/cli"
readme = "README.md"
keywords = ["fomkee", "uptime", "monitoring", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "fomkeecli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
anstream = "1"
anstyle = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
comfy-table = { version = "8", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
terminal_size = "0.4"
unicode-width = "0.2"
directories = "6"
fs2 = "0.4"
getrandom = "0.4"
keyring-core = "1"
rpassword = "7"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
tempfile = "3"
toml = "1.1"
semver = "1"
sha2 = "0.11"
self-replace = "1.5"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
windows-permissions = "0.2.4"

[dev-dependencies]
axum = "0.8"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
wildcard_enum_match_arm = "deny"
